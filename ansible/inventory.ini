[whatsapp_tracker]
# Replace with your server's IP address or hostname.
# The playbook connects as root and creates the restricted service user itself.
your-server-ip ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa

# Optional: use password auth instead of a key
# your-server-ip ansible_user=root ansible_password=your-root-password

[whatsapp_tracker:vars]
domain=my-app.com
email=admin@my-app.com
repo_url=git@github.com:ibrahimalshekh/whatsapp-tracker.git
