<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WA Analytics</title>
    <meta name="description" content="Track and analyze WhatsApp contact activity with detailed analytics and insights." />
    <meta name="theme-color" content="#25D366" />

    <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico" />
    <link rel="apple-touch-icon" href="/src/assets/wa_analytics_logo_512.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WA Analytics" />
    <meta property="og:description" content="Track and analyze WhatsApp contact activity with detailed analytics and insights." />
    <meta property="og:image" content="/src/assets/wa_analytics_logo_512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WA Analytics" />
    <meta name="twitter:description" content="Track and analyze WhatsApp contact activity with detailed analytics and insights." />
    <meta name="twitter:image" content="/src/assets/wa_analytics_logo_512.png" />
    <script>
      (function() {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p) {
          var q = new URLSearchParams(window.location.search).get('q');
          window.history.replaceState(
            null, null,
            '/wa-analytics' + p.replace(/~and~/g, '&') + (q ? '?' + q.replace(/~and~/g, '&') : '') + window.location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
